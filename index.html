<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%232a1210' width='16' height='16'/%3E%3Ccircle fill='%23e8c56b' cx='8' cy='8' r='3'/%3E%3C/svg%3E" />
  <title>3R Thanksgiving Office TV</title>
  <link rel="stylesheet" href="styles.css?v=20261027c" />
</head>
<body>
  <main id="stage" aria-label="3R Thanksgiving office slideshow">
    <video id="vid" muted autoplay playsinline preload="auto"></video>
    <div id="fx" aria-hidden="true"></div>
    <div id="fade"></div>
    <div id="progress"><span></span></div>
    <div id="countdown" aria-live="polite"></div>
    <div id="counter" aria-live="polite"></div>
    <div id="controls">
      <button id="prev" type="button" aria-label="Previous clip">◀</button>
      <button id="pause" type="button" aria-label="Pause slideshow">Ⅱ</button>
      <button id="next" type="button" aria-label="Next clip">▶</button>
      <button id="sound" type="button" aria-label="Turn sound on">🔇</button>
      <button id="full" type="button" aria-label="Fullscreen">⛶</button>
    </div>
  </main>
  <script src="clips.js"></script>
  <script src="app.js?v=20261027c"></script>
</body>
</html>
